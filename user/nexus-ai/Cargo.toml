[package]
name = "nexus-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexus-ai"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "nexus-ai-probe"
path = "src/probe.rs"
test = false
bench = false

[dependencies]
nexus-user = { path = "../nexus-user" }
nexus-ai-core = { path = "../../shared/nexus-ai" }

[features]
model = ["nexus-ai-core/model"]

[[bin]]
name = "nexus-model"
path = "src/model.rs"
test = false
bench = false
required-features = ["model"]

[[bin]]
name = "nexus-model-probe"
path = "src/model_probe.rs"
test = false
bench = false
required-features = ["model"]
