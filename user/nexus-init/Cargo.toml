[package]
name = "nexus-init"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The first program NexusOS loads from disk."

[[bin]]
name = "nexus-init"
path = "src/main.rs"
test = false

[[bin]]
name = "nexus-runtime-probe"
path = "src/runtime_probe.rs"
test = false

[[bin]]
name = "nexus-steam-diagnostic"
path = "src/steam_diagnostic.rs"
test = false

[dependencies]
nexus-user = { path = "../nexus-user" }

[features]
runtime-mesa-probe = []
runtime-glibc-probe = []
runtime-glibc32-probe = []
runtime-vulkan-probe = []
