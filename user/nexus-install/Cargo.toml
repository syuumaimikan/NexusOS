[package]
name = "nexus-install"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Installs a .nexus package onto a filesystem it was handed."
build = "build.rs"

[lib]
name = "nexus_install"
path = "src/lib.rs"
test = false

[[bin]]
name = "nexus-install"
path = "src/main.rs"
test = false

[dependencies]
nexus-user = { path = "../nexus-user" }
nexus-pkg = { path = "../../shared/nexus-pkg" }
