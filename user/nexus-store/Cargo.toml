[package]
name = "nexus-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A window for the packages this machine has, and the ones it could have."

[[bin]]
name = "nexus-store"
path = "src/main.rs"
test = false

[dependencies]
nexus-user = { path = "../nexus-user" }
nexus-ui = { path = "../nexus-ui" }
nexus-window = { path = "../nexus-window" }
nexus-install = { path = "../nexus-install" }
nexus-i18n = { path = "../../shared/nexus-i18n" }
nexus-pkg = { path = "../../shared/nexus-pkg" }
nexus-update = { path = "../../shared/nexus-update" }
nexus-look = { path = "../../shared/nexus-look" }
nexus-config = { path = "../../shared/nexus-config" }
