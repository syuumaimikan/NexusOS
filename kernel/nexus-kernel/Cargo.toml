[package]
name = "nexus-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Nexus Kernel: the NexusOS microkernel-inspired hybrid kernel."

[[bin]]
name = "nexus-kernel"
path = "src/main.rs"

[dependencies]
nexus-abi = { path = "../../shared/nexus-abi" }
nexus-mm = { path = "../nexus-mm" }

[features]
# Fault-injection builds, used by scripts/test-faults.ps1 to verify that the
# exception path actually works. They are features rather than test code
# because the only way to prove a fault handler is to take a real fault, and
# the only way to observe the result is a separate boot.
#
# A machine that resets instead of printing a diagnostic is the failure these
# guard against, and it is invisible without deliberately provoking it.
inject-page-fault = []
inject-stack-overflow = []
inject-divide-error = []

# Breaks TLB shootdown so that it invalidates only the processor that made the
# change, which is what the kernel did before shootdown existed.
#
# This one proves a *test* rather than a handler. A shootdown that silently does
# not happen looks exactly like one that does, so the self-test that checks for
# stale translations has to be shown to fail when there is something to catch;
# otherwise it is a line of output that would print either way.
inject-no-shootdown = []
